<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Моя перша HTML-форма</title>
</head>
<body>
<h1>Моя перша HTML-форма</h1>

<form action="https://httpbin.org/get" method="GET">
    <div>
        <label for="username">Ім'я:</label>
        <input type="text" id="username" name="user_name" />
    </div>
    <br />
    <div>
        <label for="birthdate">Дата народження:</label>
        <input type="date" id="birthdate" name="user_birthdate" />
    </div>
    <br />
    <div>
        <label for="email">Імейл:</label>
        <input type="email" id="email" name="user_email" />
    </div>
    <br />
    <div>
        <label for="message">Повідомлення:</label>
        <textarea id="message" name="user_message"></textarea>
    </div>
    <br />
    <p>Ваші улюблені напої?</p>
    <label><input type="checkbox" name="drink" value="coffee" /> Кава</label
    ><br />
    <label><input type="checkbox" name="drink" value="tea" /> Чай</label
    ><br />
    <label><input type="checkbox" name="drink" value="juice" /> Сік</label
    ><br />
    <label><input type="checkbox" name="drink" value="water" /> Вода</label>
    <br />
    <p>Моя національність:</p>
    <label
    ><input type="radio" name="nationality" value="ukrainian" /> Українець /
        Українка</label
    ><br />
    <label
    ><input type="radio" name="nationality" value="other" /> Інша </label
    ><br />
    <label
    ><input type="radio" name="nationality" value="none" /> Не
        вказувати</label
    >
    <br /><br />
    <button type="submit">Надіслати</button>
    <button type="reset">Очистити</button>
</form>

<br />
<picture>
    <source
            media="(max-width: 468px)"
            srcset="https://picsum.photos/300/500"
    />
    <img
            src="https://picsum.photos/1000/400"
            alt="Випадкове зображення з Picsum"
    />
</picture>
</body>
</html>
